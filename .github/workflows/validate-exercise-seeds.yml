name: Validate Exercise Seeds

on:
  push:
    branches: [main, development]
    paths:
      - 'apps/mobile/src/infrastructure/exercises/seeds/**'
      - 'apps/mobile/src/infrastructure/persistence/sqlite/ExpoSQLiteDatabaseClient.ts'
      - 'scripts/validate_exercise_seeds.py'
  pull_request:
    paths:
      - 'apps/mobile/src/infrastructure/exercises/seeds/**'
      - 'apps/mobile/src/infrastructure/persistence/sqlite/ExpoSQLiteDatabaseClient.ts'
      - 'scripts/validate_exercise_seeds.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validar seeds de exercícios
        run: python scripts/validate_exercise_seeds.py
      - name: Listar review_flags abertos (informativo)
        run: python scripts/validate_exercise_seeds.py --list-flags
