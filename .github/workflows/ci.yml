name: CI

# Rodada 3 (P1-F): o repositório não rodava NENHUM teste nem typecheck no CI —
# o único check era o validador Python de seeds. Este workflow trava regressão
# de mobile (tsc + vitest) e API (tsc + jest) em todo push/PR.

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:mobile
      - run: npm --prefix apps/mobile run typecheck
      - run: npm --prefix apps/mobile run test

  api:
    name: API (tsc + jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm --prefix apps/api run typecheck
      - run: npm run lint:api
      - run: npm --prefix apps/api run test
